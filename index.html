<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso · jynx funcionários</title>
  <meta name="description" content="Sistema de cadastro de funcionários: entre ou crie sua conta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <a class="marca" href="index.html">
      <span class="marca__ponto" aria-hidden="true"></span>
      <span>jynx<span class="marca__rota"> funcionários</span></span>
    </a>
  </header>

  <main class="auth">

    <section class="auth__form" aria-labelledby="titulo-acesso">
      <h1 id="titulo-acesso" class="auth__titulo">Cadastro de funcionários</h1>
      <p class="auth__sub">Entre para ver e organizar a sua equipe.</p>

      <!-- Abas: o JS (acesso.js) troca aria-selected, tabindex e hidden.
           Sem JS, as duas abas ficariam escondidas, mas nada aqui funciona
           sem JS mesmo (os formulários dependem do fetch). -->
      <div class="abas" role="tablist" aria-label="Acesso">
        <button id="aba-entrar" class="aba" type="button" role="tab"
                aria-selected="true" aria-controls="painel-entrar">Entrar</button>
        <button id="aba-criar-conta" class="aba" type="button" role="tab"
                aria-selected="false" aria-controls="painel-criar-conta" tabindex="-1">Criar conta</button>
      </div>

      <!-- ===== Entrar ===== -->
      <div id="painel-entrar" class="aba__painel" role="tabpanel" aria-labelledby="aba-entrar">
        <form id="form-login" class="form" method="post">
          <div class="campo">
            <label for="login-email">E-mail</label>
            <input id="login-email" name="email" type="email" inputmode="email" placeholder="voce@email.com"
                   autocomplete="username" maxlength="254" required>
          </div>

          <div class="campo">
            <label for="login-senha">Senha</label>
            <input id="login-senha" name="senha" type="password" placeholder="Sua senha"
                   autocomplete="current-password" required>
          </div>

          <p id="login-mensagem" class="mensagem" role="status"></p>

          <button id="botao-entrar" class="botao" type="submit">Entrar</button>
        </form>

        <p class="auth__troca">Ainda não tem conta? <a href="#criar-conta">Criar conta</a></p>
      </div>

      <!-- ===== Criar conta ===== -->
      <div id="painel-criar-conta" class="aba__painel" role="tabpanel" aria-labelledby="aba-criar-conta" hidden>
        <form id="form-cadastro" class="form" method="post">
          <div class="campo">
            <label for="cadastro-nome">Nome</label>
            <input id="cadastro-nome" name="nome" type="text" placeholder="Seu nome"
                   autocomplete="name" maxlength="80" required>
          </div>

          <div class="campo">
            <label for="cadastro-telefone">Telefone</label>
            <input id="cadastro-telefone" name="telefone" type="tel" inputmode="tel" placeholder="(81) 99999-0000"
                   autocomplete="tel" maxlength="20" required>
          </div>

          <div class="campo">
            <label for="cadastro-email">E-mail</label>
            <input id="cadastro-email" name="email" type="email" inputmode="email" placeholder="voce@email.com"
                   autocomplete="email" maxlength="254" required>
          </div>

          <div class="campo">
            <label for="cadastro-senha">Senha</label>
            <input id="cadastro-senha" name="senha" type="password" placeholder="Crie uma senha"
                   autocomplete="new-password" aria-describedby="cadastro-senha-ajuda" required>
            <p id="cadastro-senha-ajuda" class="campo__ajuda">Use pelo menos 6 caracteres. Ela é guardada criptografada.</p>
          </div>

          <p id="cadastro-mensagem" class="mensagem" role="status"></p>

          <button id="botao-cadastrar" class="botao" type="submit">Criar conta</button>
        </form>

        <p class="auth__troca">Já tem conta? <a href="#entrar">Entrar</a></p>
      </div>
    </section>

  </main>

  <!-- A ordem importa: api.js primeiro (ferramentas), depois acesso.js
       (abas), depois os dois formulários. Ver o topo de cada arquivo. -->
  <script src="js/api.js"></script>
  <script src="js/acesso.js"></script>
  <script src="js/login.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
