<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários · jynx/usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <a class="marca" href="index.html">
      <span class="marca__ponto" aria-hidden="true"></span>
      <span>jynx<span class="marca__rota">/usuarios</span></span>
    </a>
    <nav class="nav" aria-label="Páginas">
      <a href="index.html">Entrar</a>
      <a href="cadastro.html">Criar conta</a>
      <a href="usuarios.html" aria-current="page">Usuários</a>
    </nav>
  </header>

  <main class="painel">

    <div class="painel__cabeca">
      <div>
        <h1 class="painel__titulo">
          Usuários
          <!-- O JS coloca aqui quantos usuários vieram -->
          <span id="total-usuarios" class="painel__total">…</span>
        </h1>
        <!-- O JS troca "visitante" pelo nome de quem fez login -->
        <p class="painel__sub">Você está como <strong id="usuario-logado">visitante</strong>.</p>
      </div>

      <div class="painel__acoes">
        <span class="rota"><span class="verbo verbo--get">GET</span>/users</span>
        <button id="botao-atualizar" class="botao botao--contorno botao--pequeno" type="button">Atualizar lista</button>
        <a class="botao botao--pequeno" href="cadastro.html">Novo usuário</a>
      </div>
    </div>

    <div class="painel__grade">

      <div>
        <!-- Buscar um usuário pelo id -->
        <section class="cartao">
          <div class="cartao__cabeca">
            <h2 class="cartao__titulo">Buscar por ID</h2>
            <span class="rota"><span class="verbo verbo--get">GET</span>/user/:id</span>
          </div>

          <form id="form-busca" class="busca">
            <div class="campo">
              <label for="busca-id">ID do usuário</label>
              <input id="busca-id" name="id" type="number" min="1" placeholder="Ex.: 7" required>
            </div>
            <button id="botao-buscar" class="botao" type="submit">Buscar</button>
          </form>

          <!-- O JS mostra o usuário encontrado aqui. Vazio = escondido. -->
          <div id="resultado-busca" class="resultado"></div>
        </section>

        <!-- Lista de todos os usuários -->
        <section class="cartao lista">
          <div class="cartao__cabeca">
            <h2 class="cartao__titulo">Todos os usuários</h2>
            <span class="rota"><span class="verbo verbo--delete">DELETE</span>/user/:id</span>
          </div>

          <!-- Mensagem depois de excluir, por exemplo -->
          <p id="mensagem-lista" class="mensagem" role="status"></p>

          <table class="tabela">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">Telefone</th>
                <th scope="col">E-mail</th>
                <th scope="col"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>

            <!-- O JS limpa este tbody e cria uma linha por usuário,
                 usando o <template id="modelo-linha"> lá embaixo. -->
            <tbody id="lista-usuarios"></tbody>
          </table>

          <!-- Aparece sozinho (via CSS) quando o tbody estiver vazio -->
          <p class="vazio">Nenhum usuário por aqui. <a href="cadastro.html">Cadastre o primeiro</a>.</p>
        </section>
      </div>

      <!-- Editar um usuário -->
      <aside class="lateral">
        <section class="cartao">
          <div class="cartao__cabeca">
            <h2 class="cartao__titulo">Editar usuário</h2>
            <span class="rota"><span class="verbo verbo--put">PUT</span>/user/:id</span>
          </div>

          <form id="form-editar" class="form" method="post">
            <div class="campo">
              <label for="editar-id">ID <code>:id na URL</code></label>
              <input id="editar-id" name="id" type="number" min="1" placeholder="Clique em Editar na lista" required>
            </div>

            <div class="campo">
              <label for="editar-name">Nome <code>name</code></label>
              <input id="editar-name" name="name" type="text" required>
            </div>

            <div class="campo">
              <label for="editar-phone">Telefone <code>phone</code></label>
              <input id="editar-phone" name="phone" type="tel" required>
            </div>

            <div class="campo">
              <label for="editar-email">E-mail <code>email</code></label>
              <input id="editar-email" name="email" type="email" required>
            </div>

            <div class="campo">
              <label for="editar-password">Nova senha <code>password</code></label>
              <input id="editar-password" name="password" type="password" autocomplete="new-password" required>
            </div>

            <p id="mensagem-editar" class="mensagem" role="status"></p>

            <div class="lateral__botoes">
              <button id="botao-salvar" class="botao" type="submit">Salvar alterações</button>
              <button class="botao botao--contorno" type="reset">Limpar</button>
            </div>
          </form>
        </section>
      </aside>

    </div>
  </main>

  <!-- Modelo de uma linha da tabela. Use template.content.cloneNode(true)
       e preencha cada <td> com os dados do usuário. -->
  <template id="modelo-linha">
    <tr data-id="">
      <td class="col-id" data-rotulo="ID"></td>
      <td class="col-nome" data-rotulo="Nome"></td>
      <td class="col-telefone" data-rotulo="Telefone"></td>
      <td class="col-email" data-rotulo="E-mail"></td>
      <td class="col-acoes">
        <div class="acoes">
          <button class="botao botao--contorno botao--pequeno botao-editar" type="button">Editar</button>
          <button class="botao botao--perigo botao--pequeno botao-excluir" type="button">Excluir</button>
        </div>
      </td>
    </tr>
  </template>

  <script src="js/api.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
